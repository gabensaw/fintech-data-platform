services:

  postgres:
    image: postgres:16.5
    container_name: postgres

    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech
      POSTGRES_DB: fintech

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka

    restart: unless-stopped

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped

  producer:
    build:
      context: ./producer

    container_name: producer

    env_file:
      - .env

    depends_on:
      kafka:
        condition: service_healthy
    
    restart: unless-stopped

  spark:
    build:
      context: ./spark
      
    container_name: spark

    depends_on:
      kafka:
        condition: service_healthy

    volumes:
      - ./spark/data:/opt/spark-data
      - ./spark/app:/opt/spark-apps/app

    environment:
      SPARK_SUBMIT_OPTS: "-Duser.home=/tmp -Divy.home=/tmp/.ivy2.5.2"

    restart: unless-stopped

    command: tail -f /dev/null # keeps the Spark container running for manual spark-submit commands

  dbt:
    build:
      context: ./dbt
    
    container_name: dbt

    ports:
      - "8081:8081"

    volumes:
      - ./dbt:/dbt

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  airflow-init:
    build:
      context: ./airflow

    container_name: airflow-init

    entrypoint:
      - /opt/airflow/entrypoint.sh

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fintech:fintech@postgres/fintech
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fintech:fintech@postgres/fintech

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - airflow
      - db
      - migrate

  airflow:
    build:
      context: ./airflow

    container_name: airflow

    entrypoint:
      - /opt/airflow/entrypoint.sh

    ports:
      - "8088:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fintech:fintech@postgres/fintech
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fintech:fintech@postgres/fintech

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/dbt
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

    restart: unless-stopped
    command:
      - airflow
      - standalone

  metabase:
    image: metabase/metabase:v0.56.7

    container_name: metabase

    ports:
      - "3000:3000"
    
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: fintech
      MB_DB_PASS: fintech
      MB_DB_HOST: postgres

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
